<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  @import url('./assets/fonts/fonts.css');
  :root{
    --noche:#0B0E14; --tinta:#F2F0ED; --tenue:#A6ABB4;
    --acento:#E5502E; --linea:rgba(242,240,237,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:340px;overflow:hidden}
  .lienzo{
    position:relative;width:1280px;height:340px;background:var(--noche);
    font-family:'Inter',system-ui,sans-serif;color:var(--tinta);overflow:hidden;
  }
  /* retícula de puntos: textura, no decoración */
  .puntos{
    position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(circle,rgba(242,240,237,.13) 1px,transparent 1px);
    background-size:26px 26px;
  }
  /* el acento aparece UNA vez, como regla */
  .regla{position:absolute;left:64px;top:60px;width:96px;height:2px;background:var(--acento)}
  .kicker{
    position:absolute;left:64px;top:80px;
    font-size:13px;font-weight:600;letter-spacing:.30em;color:var(--tenue);
    text-transform:uppercase;
  }
  .nombre{
    position:absolute;left:60px;top:104px;
    font-family:'Instrument Serif',Georgia,serif;font-size:74px;line-height:1.0;
    letter-spacing:-.012em;
  }
  .lema{
    position:absolute;left:64px;top:268px;font-size:18px;font-weight:400;
    letter-spacing:-.005em;color:var(--tenue);
  }
  .lema em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;
    font-size:22px;color:var(--acento);letter-spacing:0}
  /* marca discreta a la derecha */
  .marca{position:absolute;right:64px;top:62px;text-align:right}
  .marca .n{font-family:'Instrument Serif',Georgia,serif;font-size:27px;line-height:1.1}
  .marca .s{font-size:11.5px;font-weight:600;letter-spacing:.34em;color:var(--tenue);margin-top:8px}
  .borde{position:absolute;inset:20px;border:1px solid var(--linea);pointer-events:none}
</style>
</head>
<body>
  <div class="lienzo">
    <div class="puntos"></div>
    <div class="borde"></div>
    <div class="regla"></div>
    <div class="kicker">Desarrollador de software · Medellín, Colombia</div>
    <div class="nombre">Juan Sebastián<br />Clavijo Tapias</div>
    <div class="lema">Construyo sistemas de gestión <em>a la medida</em> para PYMEs.</div>
    <div class="marca">
      <div class="n">Gamora</div>
      <div class="s">SYSTEMS</div>
    </div>
  </div>
</body>
</html>
